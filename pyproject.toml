[project]
name = "my_sqlalchemy"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0.49",
]

[tool.ruff]
line-length = 79
preview = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["W291"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
